{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card p-4">

<h3 class="text-center">Student Registration</h3>

<form method="POST">

<input class="form-control mb-3" name="name" placeholder="Name">

<input class="form-control mb-3" name="email" placeholder="Email">

<input class="form-control mb-3" name="roll_number" placeholder="Roll Number">

<select class="form-control mb-3" name="semester">

<option value="6">Semester 6</option>
<option value="7">Semester 7</option>
<option value="8">Semester 8</option>

</select>

<input class="form-control mb-3" name="password" type="password" placeholder="Password">

<button class="btn btn-success w-100">Register</button>

</form>

</div>

</div>

</div>

{% endblock %}
