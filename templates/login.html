{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card p-4">

<h3 class="text-center">Login</h3>

<form action="/login" method="POST">

<input class="form-control mb-3" name="email" placeholder="Email">

<input class="form-control mb-3" name="password" type="password" placeholder="Password">

<select class="form-control mb-3" name="role">
<option value="student">Student</option>
<option value="company">Company</option>
<option value="admin">Admin</option>
</select>

<button class="btn btn-primary w-100">Login</button>

</form>

<hr>

<a href="/register_student">Student Register</a>
<br>
<a href="/register_company">Company Register</a>

</div>

</div>

</div>

{% endblock %}
