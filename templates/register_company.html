{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card p-4">

<h3 class="text-center">Company Registration</h3>

<form method="POST">

<input class="form-control mb-3" name="name" placeholder="Company Name">

<input class="form-control mb-3" name="email" placeholder="Company Email">

<input class="form-control mb-3" name="hr" placeholder="HR Contact">

<input class="form-control mb-3" name="website" placeholder="Website">

<input class="form-control mb-3" name="password" type="password" placeholder="Password">

<button class="btn btn-success w-100">Register</button>

</form>

</div>

</div>

</div>

{% endblock %}
